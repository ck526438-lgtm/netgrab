# Déploiement en un clic sur Render (render.com) : New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: netgrab-web
    runtime: docker
    rootDir: web
    plan: free
    envVars:
      - key: NETGRAB_PASSWORD
        sync: false          # à saisir dans Render : mot de passe d'accès au site
      - key: NETGRAB_MAX_DURATION_MIN
        value: "60"
